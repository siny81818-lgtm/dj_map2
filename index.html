<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>부산시 상권·업종별 상가 지도 (Busan Store Map)</title>
  <meta name="description" content="소상공인시장진흥공단 상가(상권)정보 데이터 기반 부산시 247개 업종별 무료 인터랙티브 지도">

  <!-- Pretendard Web Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Leaflet 1.9.4 CSS (100% Free Open-source Map) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- Leaflet.markercluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-container">
    
    <!-- Left Sidebar / Mobile Bottom Sheet -->
    <aside id="sidebar" class="sidebar">
      <!-- Mobile Sheet Drag Handle -->
      <div class="sheet-drag-handle">
        <div class="drag-bar"></div>
      </div>

      <!-- Sidebar Desktop Toggle Button -->
      <button id="sidebarToggleBtn" class="sidebar-toggle-btn" title="패널 접기">
        <i class="fa-solid fa-chevron-left"></i>
      </button>

      <!-- Sidebar Header -->
      <div class="sidebar-header">
        <div class="header-title-box">
          <div class="header-icon-wrap">
            <i class="fa-solid fa-map-location-dot"></i>
          </div>
          <div>
            <div class="header-title">부산시 업종별 상권 지도</div>
            <div class="header-subtitle">
              <span>상가(상권)정보</span>
              <span class="badge-tag">2026.06 기준</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Filters & Categories Container -->
      <div class="filter-container">
        
        <!-- 1. Category Search (Autocomplete) -->
        <div>
          <div class="section-label">
            <span><i class="fa-solid fa-magnifying-glass"></i> 업종 검색 (247개 소분류)</span>
          </div>
          <div class="search-input-wrap">
            <i class="fa-solid fa-search search-icon"></i>
            <input type="text" id="catSearchInput" class="search-input" placeholder="업종명 검색 (예: 카페, 편의점, 치킨, 피부과)" autocomplete="off">
            <button type="button" id="clearCatSearchBtn" class="clear-search-btn" title="검색어 지우기">
              <i class="fa-solid fa-xmark"></i>
            </button>
            <!-- Autocomplete Results Dropdown -->
            <div id="autocompleteList" class="autocomplete-dropdown"></div>
          </div>
        </div>

        <!-- 2. Popular Quick Filter Chips -->
        <div>
          <div class="section-label">
            <span><i class="fa-solid fa-fire" style="color: #EA580C;"></i> 인기 업종 바로가기</span>
          </div>
          <div id="quickChipsContainer" class="quick-chips-wrap">
            <!-- Rendered dynamically by category.js -->
          </div>
        </div>

        <!-- 3. Hierarchical Cascading Selectors (3-Tier) -->
        <div>
          <div class="section-label">
            <span><i class="fa-solid fa-sitemap"></i> 업종 계층 선택</span>
          </div>
          <div class="category-cascader">
            <select id="majorSelect" class="custom-select" title="대분류 선택">
              <option value="">대분류 전체</option>
            </select>
            <div class="select-group">
              <select id="middleSelect" class="custom-select" disabled title="중분류 선택">
                <option value="">중분류 전체</option>
              </select>
              <select id="subSelect" class="custom-select" disabled title="소분류 선택">
                <option value="">소분류 선택</option>
              </select>
            </div>
          </div>
        </div>

        <!-- 4. Area & Keyword 2nd Filters -->
        <div>
          <div class="section-label">
            <span><i class="fa-solid fa-filter"></i> 지역 및 매장 검색</span>
          </div>
          <div class="filter-row">
            <select id="guSelect" class="gu-select" title="자치구/군 선택">
              <option value="all">구/군 전체</option>
            </select>
            <div style="flex: 1; position: relative;">
              <input type="text" id="storeKeywordInput" class="store-search-input" placeholder="상호명 / 주소 검색">
              <button type="button" id="clearStoreKeywordBtn" class="clear-search-btn" style="right: 8px;">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
            <button type="button" id="myLocationBtn" class="chip-btn" title="내 위치 주변 탐색" style="padding: 0 12px; height: 40px; border-radius: 8px;">
              <i class="fa-solid fa-crosshairs"></i>
            </button>
          </div>
        </div>

      </div>

      <!-- Statistics Summary Banner -->
      <div class="stats-banner">
        <div class="stats-header">
          <div id="selectedCatBadge" class="selected-cat-badge">
            <i class="fa-solid fa-store"></i>
            <span>편의점</span>
          </div>
          <div id="statsCountText" class="stats-count-text">
            부산시 전체 <span class="stats-count-bold">0</span>개 점포
          </div>
        </div>
        <!-- Top 5 Gu Distribution Bar Chart -->
        <div id="guDistributionBars" class="gu-distribution-wrap"></div>
      </div>

      <!-- Store List Container -->
      <div class="list-container">
        <div class="list-header">
          <span><i class="fa-solid fa-list-ul"></i> 상가 목록</span>
          <span id="listCountBadge" class="card-gu-badge">0개</span>
        </div>
        <div id="storeCardList" class="store-card-list">
          <!-- Store Cards Rendered Dynamically -->
        </div>
      </div>

    </aside>

    <!-- Main Map Container -->
    <main class="map-container">
      
      <!-- Mobile Floating Category Pill (Shown on <= 768px) -->
      <div class="mobile-category-pill">
        <div class="pill-info">
          <i class="fa-solid fa-store" style="color: var(--primary);"></i>
          <span id="mobileCategoryTitle" class="pill-title">편의점</span>
          <span id="mobileCategoryCount" class="card-gu-badge">0개</span>
        </div>
        <button id="mobileOpenSheetBtn" class="pill-btn">
          <i class="fa-solid fa-sliders"></i> 업종/필터
        </button>
      </div>

      <!-- Leaflet Map Canvas -->
      <div id="map"></div>

      <!-- Map Floating Action Buttons -->
      <div class="map-floating-controls">
        <button id="mapGpsBtn" class="floating-btn" title="내 위치로 이동">
          <i class="fa-solid fa-crosshairs"></i>
        </button>
      </div>

    </main>

    <!-- Toast Notification Message -->
    <div id="toastMsg" class="toast-msg"></div>

    <!-- Mobile Bottom Sheet Backdrop -->
    <div id="bottomSheetBackdrop" class="bottom-sheet-backdrop"></div>

  </div>

  <!-- Leaflet 1.9.4 JS (Free & Open-Source Map Engine) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Leaflet.markercluster JS -->
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- Application Modules -->
  <script src="js/category.js"></script>
  <script src="js/storeService.js"></script>
  <script src="js/map.js"></script>
  <script src="js/filter.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
